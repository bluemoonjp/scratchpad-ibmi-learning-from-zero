name: source-check

# PUB400には一切接続しない、ローカルの構文・リント検査のみのワークフロー
# (08-01の演習で使うPCからのgit pushとは別の、PC/CI側だけで完結する確認)。

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # @halcyontech/rpglint(vscode-rpgleのリンターのCLI版)。実機確認済み
      # (docs/probes.mdの08-03節参照)。rpglint.json はプロジェクト・
      # ルートに置くこと(このCLIは rpglint.json をカレント・ディレクトリー
      # 配下から自動的に探す)。
      - name: Run rpglint
        run: |
          npm i -g @halcyontech/rpglint
          rpglint
      - name: ASCII / LF / column checks
        run: node scripts/check.mjs
